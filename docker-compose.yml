# ScopeGuard — LocalStack Development Environment
# Usage: docker compose up -d
# Requires: LOCALSTACK_AUTH_TOKEN set in .env file

services:
  localstack:
    image: localstack/localstack:latest
    container_name: scopeguard-localstack
    ports:
      - "4566:4566"            # LocalStack Edge Port (all services)
      - "4510-4559:4510-4559"  # External service ports
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=s3,ec2,iam,rds,cloudwatch,lambda,sts
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
